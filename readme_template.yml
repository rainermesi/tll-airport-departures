## Trend of Daily Departures

Last 90 days. One bar per day.

```mermaid
---
xyChart:
    xAxis:
      labelFontSize: 8
---
xychart-beta
    title "{title}"
    x-axis [{x_axis}]
    y-axis "{y_axis}" 0 --> {ymax}
    bar {bar_values}
```

## Departures by quarter

Full history. Bars are the average departures per day. The line is the average number of destinations per day.

```mermaid
---
config:
  xyChart:
    showDataLabel: true
    xAxis:
      labelFontSize: 12
---
xychart-beta
    title "Departures by quarter"
    x-axis [{quarter_x}]
    y-axis "per day" 0 --> {quarter_ymax}
    bar {quarter_bar}
    line {quarter_line}
```

## Unique destinations and departures

Departures to each city since {since_date}. Airports in the same city are counted together. A multi-stop flight is counted once for each city on the title. The rates are averages over that whole span, and a longer bar means more departures.

{destination_chart}
